name: Crawler CI

on:
  push:
    paths:
      - 'crawler/**'
      - '.github/workflows/crawler-ci.yml'
  pull_request:
    paths:
      - 'crawler/**'

jobs:
  test-crawler:
    name: Test & Lint Python Crawler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd crawler
          uv sync --extra dev

      - name: Run Pytest
        run: |
          cd crawler
          uv run pytest
