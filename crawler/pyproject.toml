[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crab-news-crawler"
version = "0.1.0"
description = "News crawler, text processing, and keyword analysis engine for Crab News"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "supabase>=2.10.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.3",
    "requests>=2.32.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "urllib3>=2.3.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
crab-crawler = "crab_news.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crab_news"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
