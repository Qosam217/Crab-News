name: Crab News Crawler Runner

on:
  schedule:
    # Runs daily at 20:00 UTC (03:00 WIB) - Specifically for Antara News
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      source_slug:
        description: 'Source slug to crawl (e.g. antara, cnn-indonesia, detik, kompas, tempo, or all)'
        required: false
        default: 'antara'
      from_date:
        description: 'Start date for date range crawl (YYYY-MM-DD)'
        required: false
        default: ''
      to_date:
        description: 'End date for date range crawl (YYYY-MM-DD)'
        required: false
        default: ''
      limit:
        description: 'Max articles per source'
        required: false
        default: '30'
      dry_run:
        description: 'Run in dry-run mode (no DB writes)'
        type: boolean
        required: false
        default: false

jobs:
  run-crawler:
    name: Execute News Crawler & Analysis Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd crawler
          uv sync

      - name: Run Crawler CLI
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: INFO
        run: |
          cd crawler
          
          # Daily scheduled runs strictly crawl Antara News only
          ARGS="--source antara"

          # If manually triggered via workflow_dispatch, allow custom inputs
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.source_slug }}" ]; then
              if [ "${{ github.event.inputs.source_slug }}" = "all" ]; then
                ARGS="--all-sources"
              else
                ARGS="--source ${{ github.event.inputs.source_slug }}"
              fi
            fi
            if [ -n "${{ github.event.inputs.from_date }}" ] && [ -n "${{ github.event.inputs.to_date }}" ]; then
              ARGS="$ARGS --from-date ${{ github.event.inputs.from_date }} --to-date ${{ github.event.inputs.to_date }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            if [ -n "${{ github.event.inputs.limit }}" ]; then
              ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
            fi
          fi
          
          echo "Running: uv run python -m crab_news.cli $ARGS"
          uv run python -m crab_news.cli $ARGS
          
          # Trigger daily keyword aggregation
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "Running daily keyword aggregation..."
            uv run python -m crab_news.cli --aggregate
          fi
